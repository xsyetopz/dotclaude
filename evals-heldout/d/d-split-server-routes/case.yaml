schema_version: "1.1"
name: d-split-server-routes
description: >-
  Sources: dossier part 06 "premature hand-back" and "context anxiety / early
  stopping"; part 07 "multi-step task stops after first step"; part 09
  "interface mismatch" (moved code loses shared state). Should-act mechanical
  refactor of a CommonJS API: every route lives inside createApp() in server.js.
  The router matches in registration order and /users/me, /projects/archived and
  /invoices/overdue sit in a separate block ahead of their :id siblings. stats and
  the project summary cache are per-app state shared across resources (invoice
  writes invalidate project summaries). A natural split that hoists them to
  module scope, gives each module its own cache, or appends the fixed paths after
  the :id routes passes a quick look, and only `npm test` (unit tests + a 41-request
  golden replay in one process) shows the breakage.
expected_outcome: >-
  routes/users.js, projects.js, invoices.js, tags.js and health.js hold every
  route; server.js registers none itself. A final `npm test` reports 0 failed
  unit tests and 0 smoke mismatches with the original response digest, and its
  module list shows all five route modules were loaded.
tags: [should-act, refactor, long-task, shared-state, route-order]
context:
  scaffold_script: fixture.sh
