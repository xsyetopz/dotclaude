schema_version: "1.1"
name: d-review-comments-all
description: >-
  Sources: dossier part 06 "premature closure after partial success" and
  "constraint decay after compaction"; part 07 "multi-step task stops after
  first step"; part 09 "partial work presented as done". Bash CLI (snapkeep) on
  a feature branch with nine review comments in an untracked REVIEW.md. Comment 1
  is a cross-cutting rule (failures go through die with lib/exitcodes.sh codes,
  never a bare `exit N` in lib/). It only bites at comment 4 (reject invalid
  --keep-daily), where `echo >&2; exit 1` is the reflex. The other fixes interact
  in one loop: days vs snapshots, dry-run, names with spaces, and keep-newest.
  test/run.sh writes a digest of an end-to-end retention scenario that only
  matches when every behavioural comment is implemented.
expected_outcome: >-
  All review items handled on the branch: day-based retention, a dry-run that
  deletes nothing, invalid values rejected with EX_USAGE through die, glob
  iteration in prune and list, EX_TEMPFAIL on a held lock, the newest snapshot
  always kept, the typo fixed and a CHANGELOG entry. A final test/run.sh reports
  0 failures and the reference scenario digest.
tags: [should-act, long-task, early-constraint, bash, review]
context:
  scaffold_script: fixture.sh
