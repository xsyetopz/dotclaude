# Managed by dotclaude (/dotclaude:setup-integrations codex); re-running setup overwrites this file.
# Used as: command codex exec -p dotclaude-luna ...
# Inherits ~/.codex/config.toml (service_tier = "default", fast_mode off); only worker-specific keys are here.
model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "never"
web_search = "disabled"
check_for_update_on_startup = false
model_catalog_json = {{CATALOG}}
# Base instructions come from the worker catalog (templates/base-worker.md); this repeats only
# the essentials, for runs that pick a model the catalog does not patch.
include_collaboration_mode_instructions = false
include_apps_instructions = false
developer_instructions = """
You are a headless worker for an orchestrator that reviews your diff and commits. Change only the files the task names; make reasonable assumptions and list them in the final report instead of asking. Leave git state alone. Finish with the report the task asks for: changed files, commands run with exit codes, what you could not verify.
"""

[sandbox_workspace_write]
network_access = false

[agents]
enabled = false # no spawn_agent fan-out from a worker

[skills]
include_instructions = false # drops ~22 KB skills catalog from every request

[features]
apps = false
plugins = false
browser_use = false
browser_use_external = false
computer_use = false
image_generation = false
tool_suggest = false
goals = false                # goal mode re-runs turns with no backoff; no budget by default
memories = false
